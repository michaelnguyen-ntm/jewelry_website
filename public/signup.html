<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo tài khoản — Aurelle</title>
  <meta name="description" content="Aurelle — trang sức cao cấp, chế tác tận tâm. Nhẫn, dây chuyền, bông tai và vòng tay được làm ra để đồng hành cùng bạn trọn đời.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23201c19'/%3E%3Cpath d='M16 7l7 9-7 9-7-9z' fill='%23c9a66b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>window.InsiderQueue = window.InsiderQueue || [];</script>
  <script async src="https://indemo.api.useinsider.com/ins.js?id=10005413"></script>
</head>
<body data-page="signup">
  <header id="site-header"></header>
  <main>
    <section class="container section tight">
      <form id="auth-form" class="form auth-card">
        <p class="eyebrow">Gia nhập Aurelle</p>
        <h1>Tạo tài khoản của bạn</h1>
        <label>Họ và tên<input name="name" autocomplete="name" maxlength="80" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
        <label>Mật khẩu<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required><small>Ít nhất 8 ký tự</small></label>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn block" type="submit">Tạo tài khoản</button>
        <p class="auth-alt">Đã có tài khoản? <a href="/login" data-keep-next>Đăng nhập</a></p>
      </form>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/art.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
