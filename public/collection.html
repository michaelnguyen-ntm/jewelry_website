<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tất cả sản phẩm | PNJ</title>
  <meta name="description" content="PNJ — Niềm tin và Phong cách. Trang sức cao cấp: nhẫn, dây chuyền, bông tai và vòng tay được chế tác tinh xảo để đồng hành cùng bạn trọn đời.">
  <link rel="icon" href="/img/brand/pnj-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>window.InsiderQueue = window.InsiderQueue || [];</script>
  <script async src="https://indemo.api.useinsider.com/ins.js?id=10005413"></script>
</head>
<body data-page="collection">
  <header id="site-header"></header>
  <main>
    <section class="page-head">
      <div class="container">
        <p class="eyebrow">Trang sức cao cấp</p>
        <h1 id="collection-title">Bộ sưu tập</h1>
      </div>
    </section>
    <section class="container section tight">
      <div class="toolbar">
        <div class="chips" id="category-chips"></div>
        <div class="toolbar-end">
          <span class="muted" id="collection-count"></span>
          <label class="sort">Sắp xếp theo
            <select id="sort">
              <option value="featured">Nổi bật</option>
              <option value="price-asc">Giá: thấp đến cao</option>
              <option value="price-desc">Giá: cao đến thấp</option>
              <option value="name">Tên</option>
            </select>
          </label>
        </div>
      </div>
      <div class="grid" id="collection-grid"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/art.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
